<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>اطلب من هنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --bg: #0c0f12; --bg-raised: #14181d; --bg-sunken: #08090b; --surface: #181d23;
    --border: #262c33; --border-strong: #3a424c; --text: #eef1f4; --text-dim: #8b95a1; --text-faint: #565f6a;
    --amber: #ff8a1e; --amber-dim: #7a4413; --teal: #2dd4bf; --teal-dim: #0f3d38;
    --red: #ef4444; --green: #22c55e;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px;
    --font: 'Cairo', sans-serif; --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh;
    padding-bottom: 100px; -webkit-font-smoothing: antialiased;
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

.op-header {
    padding: 20px 16px 14px; text-align: center; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,138,30,0.08), transparent);
}
.op-brand { font-family: var(--font-mono); font-weight: 800; letter-spacing: 0.08em; color: var(--amber); font-size: 14px; margin-bottom: 6px; }
.op-station { font-size: 20px; font-weight: 800; }
.op-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }

.op-center-screen { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
.op-center-screen .icon { font-size: 42px; color: var(--amber); margin-bottom: 14px; }
.op-center-screen h2 { font-size: 18px; margin-bottom: 8px; }
.op-center-screen p { font-size: 13.5px; color: var(--text-dim); line-height: 1.6; }

.op-content { padding: 14px; }
.op-category { font-size: 13px; font-weight: 800; color: var(--teal); margin: 18px 4px 8px; }
.op-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px;
}
.op-item-name { font-weight: 700; font-size: 14.5px; }
.op-item-price { font-family: var(--font-mono); color: var(--text-dim); font-size: 12.5px; margin-top: 2px; }
.op-qty { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.op-qty button {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--bg-sunken);
    color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.op-qty button.amber { background: var(--amber); border-color: var(--amber); color: #1a0f00; }
.op-qty .qty-val { min-width: 18px; text-align: center; font-weight: 800; font-family: var(--font-mono); }

.op-cartbar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-raised); border-top: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.4); transform: translateY(120%); transition: transform 0.25s ease; z-index: 50;
}
.op-cartbar.show { transform: translateY(0); }
.op-cartbar .cart-info { font-size: 13px; color: var(--text-dim); }
.op-cartbar .cart-total { font-family: var(--font-mono); font-weight: 800; font-size: 17px; color: var(--amber); }
.op-cartbar button {
    background: var(--amber); color: #1a0f00; border: none; border-radius: var(--radius-sm); padding: 12px 20px;
    font-weight: 800; font-size: 14px; cursor: pointer; font-family: var(--font);
}

.op-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: flex-end; justify-content: center; z-index: 60;
}
.op-overlay.show { display: flex; }
.op-sheet { background: var(--bg-raised); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 20px 16px 24px; max-height: 85vh; overflow-y: auto; }
.op-sheet-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
.op-sheet-title button { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
.op-review-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13.5px; }
.op-review-total { display: flex; justify-content: space-between; padding: 12px 0 4px; font-weight: 800; font-size: 15px; color: var(--amber); }
.op-note-input {
    width: 100%; margin-top: 12px; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); padding: 10px; font-family: var(--font); font-size: 13.5px; resize: none;
}
.op-confirm-btn {
    width: 100%; margin-top: 14px; background: var(--amber); color: #1a0f00; border: none; border-radius: var(--radius-sm);
    padding: 14px; font-weight: 800; font-size: 15px; cursor: pointer; font-family: var(--font);
}
.op-confirm-btn:disabled { opacity: 0.6; }

.op-toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--surface);
    border: 1px solid var(--border-strong); color: var(--text); padding: 10px 18px; border-radius: var(--radius-sm);
    font-size: 13px; z-index: 80; opacity: 0; transition: all 0.25s ease; pointer-events: none;
}
.op-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="opToast" class="op-toast"></div>

<!-- STATE: LOADING -->
<div id="opLoading" class="op-center-screen">
    <div>
        <div class="icon"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
        <h2>بنجهزلك المنيو…</h2>
    </div>
</div>

<!-- STATE: ERROR / DISABLED -->
<div id="opError" class="op-center-screen hidden">
    <div>
        <div class="icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h2 id="opErrorTitle">في مشكلة</h2>
        <p id="opErrorMsg">حصل خطأ، حاول تفتح الصفحة تاني.</p>
    </div>
</div>

<!-- STATE: SENT -->
<div id="opSent" class="op-center-screen hidden">
    <div>
        <div class="icon" style="color:var(--green);"><i class="fa-solid fa-circle-check"></i></div>
        <h2>تم إرسال طلبك! 🎉</h2>
        <p>الطلب وصل للصالة وهيتم تجهيزه في أقرب وقت.</p>
    </div>
</div>

<!-- STATE: MENU -->
<div id="opMenuScreen" class="hidden">
    <div class="op-header">
        <div class="op-brand">✦ DORAK ✦</div>
        <div class="op-station" id="opStationName">—</div>
        <div class="op-sub">اختار اللي يعجبك وابعت طلبك من هنا</div>
    </div>
    <div class="op-content" id="opMenuContent"></div>
</div>

<div class="op-cartbar" id="opCartBar">
    <div>
        <div class="cart-info" id="opCartInfo">0 صنف</div>
        <div class="cart-total mono" id="opCartTotal">0 ج</div>
    </div>
    <button onclick="openReview()"><i class="fa-solid fa-bag-shopping"></i> مراجعة الطلب</button>
</div>

<div class="op-overlay" id="opReviewOverlay">
    <div class="op-sheet">
        <div class="op-sheet-title"><span>مراجعة الطلب</span><button onclick="closeReview()"><i class="fa-solid fa-xmark"></i></button></div>
        <div id="opReviewRows"></div>
        <div class="op-review-total"><span>الإجمالي</span><span id="opReviewTotal" class="mono">0 ج</span></div>
        <textarea class="op-note-input" id="opNote" rows="2" placeholder="ملاحظة على الطلب (اختياري)"></textarea>
        <button class="op-confirm-btn" id="opConfirmBtn" onclick="sendOrder()"><i class="fa-solid fa-paper-plane"></i> إرسال الطلب</button>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://fhjhtgbvtkuhhzitvxtx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_X0aLD3gjXGqC_no4gW78ng_TWztP5cd';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let station = null;
let business = null;
let menuItems = [];
let cart = {}; // menu_item_id -> qty

const CATEGORY_LABELS = { cold_drinks: '🧊 مشروبات باردة', hot_drinks: '☕ مشروبات ساخنة', food: '🍔 أكل', other: '📦 أخرى' };
function normalizeCategory(c) {
    const v = String(c || '').trim().toLowerCase();
    const map = { 'مشروبات باردة': 'cold_drinks', 'cold drinks': 'cold_drinks', 'cold_drinks': 'cold_drinks',
        'مشروبات ساخنة': 'hot_drinks', 'hot drinks': 'hot_drinks', 'hot_drinks': 'hot_drinks',
        'أكل': 'food', 'اكل': 'food', 'food': 'food', 'أخرى': 'other', 'اخري': 'other', 'other': 'other' };
    return map[v] || 'other';
}

function showState(id) {
    ['opLoading', 'opError', 'opSent', 'opMenuScreen'].forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id));
}

function showToastMsg(msg) {
    const el = document.getElementById('opToast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
}

function showError(title, msg) {
    document.getElementById('opErrorTitle').textContent = title;
    document.getElementById('opErrorMsg').textContent = msg;
    showState('opError');
}

async function init() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('t');
    if (!token) { showError('رابط غير صحيح', 'الرابط ده مش رابط جهاز صحيح. امسح كود الـ QR تاني من على الجهاز.'); return; }

    try {
        const { data: st, error: stErr } = await supabaseClient.from('stations').select('*').eq('qr_token', token).maybeSingle();
        if (stErr || !st) { showError('الجهاز غير موجود', 'مش لاقيين الجهاز ده. اتأكد إنك ماسح آخر كود QR متاح.'); return; }
        station = st;

        const { data: biz, error: bizErr } = await supabaseClient.from('businesses').select('*').eq('id', st.business_id).maybeSingle();
        if (bizErr || !biz) { showError('حصل خطأ', 'تعذر تحميل بيانات الصالة، حاول تاني.'); return; }
        business = biz;

        if (!business.qr_ordering_enabled) {
            showError('الخدمة متوقفة حاليًا', 'الطلب عبر QR مش متاح دلوقتي في الصالة دي. تقدر تنادي على الموظف مباشرة.');
            return;
        }

        const { data: items, error: itemsErr } = await supabaseClient.from('menu_items').select('*').eq('business_id', business.id).eq('active', true).order('created_at');
        if (itemsErr) { showError('حصل خطأ', 'تعذر تحميل المنيو، حاول تاني.'); return; }
        menuItems = items || [];

        if (menuItems.length === 0) {
            showError('المنيو فاضي حاليًا', 'مفيش أصناف متاحة للطلب دلوقتي.');
            return;
        }

        document.getElementById('opStationName').textContent = station.name || ('جهاز ' + station.number);
        renderMenu();
        showState('opMenuScreen');
    } catch (e) {
        console.error(e);
        showError('حصل خطأ', 'حصلت مشكلة في الاتصال، حاول تاني.');
    }
}

function renderMenu() {
    const grouped = {};
    menuItems.forEach(item => {
        const cat = normalizeCategory(item.category);
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(item);
    });

    const order = ['food', 'cold_drinks', 'hot_drinks', 'other'];
    let html = '';
    order.forEach(cat => {
        if (!grouped[cat]) return;
        html += `<div class="op-category">${CATEGORY_LABELS[cat]}</div>`;
        grouped[cat].forEach(item => {
            html += `<div class="op-item">
                <div>
                    <div class="op-item-name">${escapeHtml(item.name)}</div>
                    <div class="op-item-price">${money(item.price)} ج</div>
                </div>
                <div class="op-qty" id="qty-${item.id}">
                    <button onclick="changeQty('${item.id}', -1)">−</button>
                    <span class="qty-val" id="qtyval-${item.id}">0</span>
                    <button class="amber" onclick="changeQty('${item.id}', 1)">+</button>
                </div>
            </div>`;
        });
    });
    document.getElementById('opMenuContent').innerHTML = html;
}

function changeQty(itemId, delta) {
    const current = cart[itemId] || 0;
    const next = Math.max(0, Math.min(50, current + delta));
    if (next === 0) delete cart[itemId]; else cart[itemId] = next;
    document.getElementById('qtyval-' + itemId).textContent = next;
    updateCartBar();
}

function cartLines() {
    return Object.entries(cart).map(([id, qty]) => {
        const item = menuItems.find(m => String(m.id) === String(id));
        return item ? { id: item.id, name: item.name, price: Number(item.price), qty } : null;
    }).filter(Boolean);
}

function updateCartBar() {
    const lines = cartLines();
    const count = lines.reduce((s, l) => s + l.qty, 0);
    const total = lines.reduce((s, l) => s + l.qty * l.price, 0);
    const bar = document.getElementById('opCartBar');
    bar.classList.toggle('show', count > 0);
    document.getElementById('opCartInfo').textContent = count + (count === 1 ? ' صنف' : ' أصناف');
    document.getElementById('opCartTotal').textContent = money(total) + ' ج';
}

function openReview() {
    const lines = cartLines();
    if (lines.length === 0) return;
    const total = lines.reduce((s, l) => s + l.qty * l.price, 0);
    document.getElementById('opReviewRows').innerHTML = lines.map(l =>
        `<div class="op-review-row"><span>${escapeHtml(l.name)} × ${l.qty}</span><span class="mono">${money(l.qty * l.price)} ج</span></div>`
    ).join('');
    document.getElementById('opReviewTotal').textContent = money(total) + ' ج';
    document.getElementById('opReviewOverlay').classList.add('show');
}
function closeReview() { document.getElementById('opReviewOverlay').classList.remove('show'); }

async function sendOrder() {
    const lines = cartLines();
    if (lines.length === 0) return;
    const btn = document.getElementById('opConfirmBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري الإرسال…';

    const note = document.getElementById('opNote').value.trim();
    try {
        const { error } = await supabaseClient.from('qr_orders').insert({
            business_id: business.id,
            station_id: station.id,
            items: lines,
            note: note || null,
            status: 'pending'
        });
        if (error) throw error;
        cart = {};
        closeReview();
        showState('opSent');
    } catch (e) {
        console.error(e);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> إرسال الطلب';
        showToastMsg('حصل خطأ، حاول تبعت الطلب تاني.');
    }
}

function money(n) { return (Number(n) || 0).toLocaleString('ar-EG', { maximumFractionDigits: 0 }); }
function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
}

init();
</script>
</body>
</html>
